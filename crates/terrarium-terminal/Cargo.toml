[package]
name = "terrarium-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Terminal-based renderer for Agent Terrarium"

[[bin]]
name = "terrarium-tui"
path = "src/main.rs"

[dependencies]
terrarium-sim = { path = "../terrarium-sim" }
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
log = "0.4"
env_logger = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
