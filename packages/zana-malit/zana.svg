<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -32 36 52">
  <!-- Long dark hair (behind body) -->
  <ellipse cx="-4" cy="-10" rx="10" ry="22" fill="#1A1008" opacity="0.9"/>
  <ellipse cx="4" cy="-10" rx="10" ry="22" fill="#1A1008" opacity="0.9"/>
  <ellipse cx="0" cy="-8" rx="8" ry="20" fill="#2A1A0E"/>

  <!-- Body / dress (red) -->
  <path d="M -8,0 Q -9,-4 -7,-8 Q -4,-12 0,-13 Q 4,-12 7,-8 Q 9,-4 8,0 L 9,10 Q 10,14 12,16 L -12,16 Q -10,14 -9,10 Z" fill="#D01020"/>
  <!-- Dress accent (darker red folds) -->
  <path d="M -4,0 Q -2,6 -5,14 L -8,16 L -5,16 Q -2,10 -1,4 Z" fill="#A00D1A" opacity="0.4"/>
  <path d="M 4,0 Q 2,6 5,14 L 8,16 L 5,16 Q 2,10 1,4 Z" fill="#A00D1A" opacity="0.4"/>
  <!-- Black sash / eagle motif -->
  <rect x="-6" y="-2" width="12" height="3" rx="1" fill="#1A1A1A" opacity="0.7"/>

  <!-- Arms -->
  <path d="M -8,-4 Q -12,0 -11,5" stroke="#F2D5C0" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 8,-4 Q 12,0 11,5" stroke="#F2D5C0" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Legs -->
  <path d="M -4,15 L -4,18 L -6,19" stroke="#D01020" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 4,15 L 4,18 L 6,19" stroke="#D01020" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Head -->
  <ellipse cx="0" cy="-18" rx="7.5" ry="10" fill="#F2D5C0"/>

  <!-- Hair over forehead -->
  <path d="M -9,-20 Q -8,-28 -2,-28 Q 2,-29 6,-27 Q 10,-25 9,-19 Q 8,-24 4,-26 Q 0,-27 -4,-26 Q -7,-24 -8,-20 Z" fill="#1A1008"/>
  <!-- Side hair strands -->
  <path d="M -9,-18 Q -11,-14 -10,-6" stroke="#1A1008" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 9,-18 Q 11,-14 10,-6" stroke="#1A1008" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="-3.5" cy="-19" rx="2.2" ry="2.4" fill="white"/>
  <ellipse cx="3.5" cy="-19" rx="2.2" ry="2.4" fill="white"/>
  <circle cx="-3.5" cy="-19" r="1.3" fill="#2D1A10"/>
  <circle cx="3.5" cy="-19" r="1.3" fill="#2D1A10"/>
  <circle cx="-3" cy="-19.5" r="0.4" fill="white"/>
  <circle cx="4" cy="-19.5" r="0.4" fill="white"/>

  <!-- Eyebrows -->
  <path d="M -5.5,-21.5 Q -3.5,-22.5 -1.5,-21.5" stroke="#1A1008" stroke-width="0.7" fill="none"/>
  <path d="M 1.5,-21.5 Q 3.5,-22.5 5.5,-21.5" stroke="#1A1008" stroke-width="0.7" fill="none"/>

  <!-- Nose -->
  <ellipse cx="0" cy="-16.5" rx="1" ry="0.7" fill="#E0B89E"/>

  <!-- Smile -->
  <path d="M -2.5,-14.5 Q 0,-13 2.5,-14.5" stroke="#C47070" stroke-width="0.8" fill="none" stroke-linecap="round"/>

  <!-- Cheeks -->
  <circle cx="-6" cy="-16" r="2" fill="#F4A0A0" opacity="0.35"/>
  <circle cx="6" cy="-16" r="2" fill="#F4A0A0" opacity="0.35"/>
</svg>
