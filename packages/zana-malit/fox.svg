<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -28 32 46">
  <!-- Tail (bushy) -->
  <path d="M 3,10 Q 10,6 14,10 Q 16,14 12,16 Q 8,18 4,14 Z" fill="#D84315"/>
  <path d="M 12,16 Q 10,17 8,16" fill="white" opacity="0.6"/>

  <!-- Legs -->
  <path d="M -4,12 L -4,16 L -5,17" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 3,12 L 3,16 L 4,17" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Body -->
  <ellipse cx="0" cy="4" rx="7" ry="9" fill="#E64A19"/>
  <!-- Belly -->
  <ellipse cx="0" cy="6" rx="4.5" ry="5.5" fill="#FFCCBC"/>

  <!-- Head -->
  <ellipse cx="0" cy="-12" rx="6.5" ry="6" fill="#E64A19"/>
  <!-- White face -->
  <path d="M -3,-10 Q 0,-6 3,-10 Q 2,-14 0,-15 Q -2,-14 -3,-10 Z" fill="#FFCCBC"/>

  <!-- Ears (large, pointed) -->
  <path d="M -4,-17 L -7,-26 L -1,-19 Z" fill="#E64A19"/>
  <path d="M 4,-17 L 7,-26 L 1,-19 Z" fill="#E64A19"/>
  <path d="M -3.5,-18 L -5.5,-24 L -1.5,-19.5 Z" fill="#1A1A1A" opacity="0.6"/>
  <path d="M 3.5,-18 L 5.5,-24 L 1.5,-19.5 Z" fill="#1A1A1A" opacity="0.6"/>

  <!-- Eyes -->
  <ellipse cx="-2.2" cy="-13" rx="1.5" ry="1.7" fill="#FFF"/>
  <ellipse cx="2.2" cy="-13" rx="1.5" ry="1.7" fill="#FFF"/>
  <ellipse cx="-2.2" cy="-13" rx="0.9" ry="1.2" fill="#F57F17"/>
  <ellipse cx="2.2" cy="-13" rx="0.9" ry="1.2" fill="#F57F17"/>
  <circle cx="-2.2" cy="-13" r="0.5" fill="#1A1A1A"/>
  <circle cx="2.2" cy="-13" r="0.5" fill="#1A1A1A"/>

  <!-- Nose -->
  <ellipse cx="0" cy="-9.5" rx="1.5" ry="1" fill="#1A1A1A"/>

  <!-- Mouth -->
  <path d="M 0,-8.5 L 0,-8" stroke="#1A1A1A" stroke-width="0.4"/>
  <path d="M -1.5,-8 Q 0,-7.2 1.5,-8" stroke="#1A1A1A" stroke-width="0.4" fill="none"/>

  <!-- Whiskers -->
  <line x1="-3" y1="-10" x2="-7" y2="-11" stroke="#1A1A1A" stroke-width="0.3" opacity="0.5"/>
  <line x1="-3" y1="-9" x2="-7" y2="-9" stroke="#1A1A1A" stroke-width="0.3" opacity="0.5"/>
  <line x1="3" y1="-10" x2="7" y2="-11" stroke="#1A1A1A" stroke-width="0.3" opacity="0.5"/>
  <line x1="3" y1="-9" x2="7" y2="-9" stroke="#1A1A1A" stroke-width="0.3" opacity="0.5"/>
</svg>
