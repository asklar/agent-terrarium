<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -28 32 46">
  <!-- Tail feathers -->
  <path d="M -2,10 L -5,16 L -1,13 L 2,17 L 3,12 Z" fill="#5D4037"/>
  <path d="M -4,14 L -7,17" stroke="#4E342E" stroke-width="0.8" fill="none"/>

  <!-- Legs -->
  <path d="M -3,10 L -3,14 L -5,15" stroke="#8D6E63" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <path d="M -3,14 L -1,15" stroke="#8D6E63" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  <path d="M 3,10 L 3,14 L 5,15" stroke="#8D6E63" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <path d="M 3,14 L 1,15" stroke="#8D6E63" stroke-width="0.8" stroke-linecap="round" fill="none"/>

  <!-- Wings (folded) -->
  <path d="M -7,-2 Q -10,2 -9,7 Q -8,9 -5,8 Q -7,4 -6,0 Z" fill="#3E2723"/>
  <path d="M 7,-2 Q 10,2 9,7 Q 8,9 5,8 Q 7,4 6,0 Z" fill="#3E2723"/>

  <!-- Body -->
  <ellipse cx="0" cy="2" rx="7" ry="9" fill="#4E342E"/>
  <!-- Belly -->
  <ellipse cx="0" cy="3" rx="4.5" ry="6" fill="#795548"/>
  <!-- Belly barring pattern -->
  <path d="M -3,0 Q 0,1 3,0" stroke="#5D4037" stroke-width="0.5" fill="none"/>
  <path d="M -3.5,2 Q 0,3 3.5,2" stroke="#5D4037" stroke-width="0.5" fill="none"/>
  <path d="M -3,4 Q 0,5 3,4" stroke="#5D4037" stroke-width="0.5" fill="none"/>

  <!-- Head -->
  <ellipse cx="0" cy="-10" rx="5.5" ry="5.5" fill="#5D4037"/>

  <!-- Eyes -->
  <ellipse cx="-2.2" cy="-11" rx="1.6" ry="1.7" fill="#FFF"/>
  <ellipse cx="2.2" cy="-11" rx="1.6" ry="1.7" fill="#FFF"/>
  <circle cx="-2.2" cy="-11" r="1" fill="#1A1A1A"/>
  <circle cx="2.2" cy="-11" r="1" fill="#1A1A1A"/>
  <!-- Eye ring -->
  <circle cx="-2.2" cy="-11" r="1.7" stroke="#F9A825" stroke-width="0.5" fill="none"/>
  <circle cx="2.2" cy="-11" r="1.7" stroke="#F9A825" stroke-width="0.5" fill="none"/>

  <!-- Beak -->
  <path d="M 0,-8.5 L -1.5,-7 L 0,-5.5 L 1.5,-7 Z" fill="#455A64"/>
  <path d="M 0,-7.5 L -0.8,-7 L 0,-6.2 L 0.8,-7 Z" fill="#37474F"/>
</svg>
