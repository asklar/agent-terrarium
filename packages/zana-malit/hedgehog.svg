<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -12 28 20">
  <!-- Body (spiky back) -->
  <ellipse cx="0" cy="0" rx="10" ry="7" fill="#8D6E63"/>
  <!-- Spines -->
  <path d="M -8,-4 L -9,-9 L -6,-5" fill="#5D4037"/>
  <path d="M -5,-5 L -5,-11 L -3,-6" fill="#4E342E"/>
  <path d="M -2,-6 L -1,-12 L 0,-6" fill="#5D4037"/>
  <path d="M 1,-6 L 3,-11 L 4,-5" fill="#4E342E"/>
  <path d="M 5,-5 L 7,-10 L 8,-4" fill="#5D4037"/>
  <path d="M 7,-3 L 10,-7 L 9,-2" fill="#4E342E"/>
  <path d="M -9,-2 L -12,-5 L -10,-1" fill="#5D4037"/>

  <!-- Face -->
  <ellipse cx="-8" cy="1" rx="5" ry="4.5" fill="#D7B899"/>
  <!-- Nose -->
  <circle cx="-12" cy="1" r="1.5" fill="#3E2723"/>
  <!-- Eye -->
  <circle cx="-8" cy="-1" r="1.2" fill="#1A1A1A"/>
  <circle cx="-8.4" cy="-1.4" r="0.3" fill="white"/>
  <!-- Ear -->
  <ellipse cx="-6" cy="-3.5" rx="1.8" ry="2" fill="#C9A882"/>
  <!-- Cheek -->
  <circle cx="-7" cy="2" r="1.5" fill="#E8A0A0" opacity="0.3"/>
  <!-- Tiny smile -->
  <path d="M -10,2.5 Q -9,3.5 -7.5,2.8" stroke="#8D6E63" stroke-width="0.5" fill="none"/>

  <!-- Feet -->
  <ellipse cx="-4" cy="6" rx="2" ry="1.2" fill="#C9A882"/>
  <ellipse cx="3" cy="6" rx="2" ry="1.2" fill="#C9A882"/>
</svg>
