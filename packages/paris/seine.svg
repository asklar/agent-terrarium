  <!-- Bridge pillars -->
  <rect x="135" y="-4" width="6" height="16" fill="#8D6E63"/>
  <rect x="181" y="-4" width="6" height="16" fill="#8D6E63"/>
  <rect x="225" y="-4" width="6" height="16" fill="#8D6E63"/>
