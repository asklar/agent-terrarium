  <line x1="11" y1="120" x2="16" y2="130" stroke="#78909C" stroke-width="0.35"/>
  <line x1="18" y1="120" x2="9" y2="130" stroke="#78909C" stroke-width="0.35"/>
  <line x1="7" y1="140" x2="12" y2="150" stroke="#78909C" stroke-width="0.35"/>
  <line x1="14" y1="140" x2="4.5" y2="150" stroke="#78909C" stroke-width="0.35"/>
  <!-- Right leg with curved arch -->
  <path d="M 40 109.5 Q 43 130 48 150 Q 50 155 52 157" stroke="#5D6D7E" stroke-width="1.4" fill="none"/>
  <path d="M 47 109.5 Q 50 130 56 150 Q 58 155 61 157" stroke="#5D6D7E" stroke-width="1.4" fill="none"/>
  <!-- Right leg arch at base -->
  <path d="M 52 157 Q 56.5 148 61 157" fill="none" stroke="#6D7F8E" stroke-width="1.2"/>
