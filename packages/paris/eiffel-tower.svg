  <line x1="20" y1="79" x2="40" y2="79" stroke="#6D7F8E" stroke-width="0.7"/>
  <line x1="18.5" y1="87" x2="41.5" y2="87" stroke="#6D7F8E" stroke-width="0.7"/>
  <line x1="17" y1="95" x2="43" y2="95" stroke="#6D7F8E" stroke-width="0.7"/>
  <!-- Middle diagonal cross-struts -->
  <line x1="23" y1="63" x2="38" y2="71" stroke="#78909C" stroke-width="0.4"/>
  <line x1="37" y1="63" x2="22" y2="71" stroke="#78909C" stroke-width="0.4"/>
  <line x1="20" y1="79" x2="41.5" y2="87" stroke="#78909C" stroke-width="0.4"/>
