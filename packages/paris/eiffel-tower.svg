  <line x1="42" y1="120" x2="49" y2="120" stroke="#6D7F8E" stroke-width="0.6"/>
  <line x1="44" y1="130" x2="51" y2="130" stroke="#6D7F8E" stroke-width="0.6"/>
  <line x1="46" y1="140" x2="53" y2="140" stroke="#6D7F8E" stroke-width="0.6"/>
  <line x1="48" y1="150" x2="55.5" y2="150" stroke="#6D7F8E" stroke-width="0.6"/>
  <!-- Right leg diagonal struts -->
  <line x1="42" y1="120" x2="51" y2="130" stroke="#78909C" stroke-width="0.35"/>
  <line x1="49" y1="120" x2="44" y2="130" stroke="#78909C" stroke-width="0.35"/>
  <line x1="46" y1="140" x2="55.5" y2="150" stroke="#78909C" stroke-width="0.35"/>
  <line x1="53" y1="140" x2="48" y2="150" stroke="#78909C" stroke-width="0.35"/>
  <!-- Base -->
  <path d="M -3 157 L 63 157 L 63 160 L -3 160 Z" fill="#455A64"/>
  <!-- Evening illumination lights -->
  <circle cx="30" cy="14" r="0.7" fill="#FFD54F" opacity="0.7"/>
  <circle cx="28" cy="35" r="0.5" fill="#FFD54F" opacity="0.5"/>
  <circle cx="32" cy="35" r="0.5" fill="#FFD54F" opacity="0.5"/>
  <circle cx="30" cy="52" r="0.7" fill="#FFD54F" opacity="0.6"/>
  <circle cx="25" cy="75" r="0.5" fill="#FFD54F" opacity="0.4"/>
  <circle cx="35" cy="75" r="0.5" fill="#FFD54F" opacity="0.4"/>
  <circle cx="30" cy="87" r="0.5" fill="#FFD54F" opacity="0.4"/>
  <circle cx="20" cy="95" r="0.5" fill="#FFD54F" opacity="0.35"/>
  <circle cx="40" cy="95" r="0.5" fill="#FFD54F" opacity="0.35"/>
  <circle cx="10" cy="135" r="0.5" fill="#FFD54F" opacity="0.3"/>
  <circle cx="50" cy="135" r="0.5" fill="#FFD54F" opacity="0.3"/>
