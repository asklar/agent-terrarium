  <line x1="23.5" y1="42" x2="36.5" y2="42" stroke="#9E9E9E" stroke-width="0.4"/>
  <!-- Body / flowing robes -->
  <path d="M26 18 Q24 23 24 28 Q23 32 24 35 L36 35 Q37 32 36 28 Q36 23 34 18Z" fill="#F5F5F5"/>
  <path d="M30 20 Q29 25 28.5 30 L31.5 30 Q31 25 30 20Z" fill="#E0E0E0" opacity="0.4"/>
  <!-- Arms outstretched with drape -->
  <path d="M26 17 Q18 14 10 13.5 Q5 13.5 2 15 L2 17.5 Q5 16 10 15.5 Q18 16 26 19Z" fill="#F5F5F5"/>
  <path d="M34 17 Q42 14 50 13.5 Q55 13.5 58 15 L58 17.5 Q55 16 50 15.5 Q42 16 34 19Z" fill="#F5F5F5"/>
  <!-- Arm shadow for depth -->
  <path d="M26 18 Q18 15.5 10 15 Q5 15 2 16.5 L2 17.5 Q5 16 10 15.5 Q18 16 26 19Z" fill="#E0E0E0" opacity="0.35"/>
  <path d="M34 18 Q42 15.5 50 15 Q55 15 58 16.5 L58 17.5 Q55 16 50 15.5 Q42 16 34 19Z" fill="#E0E0E0" opacity="0.35"/>
  <!-- Hands -->
  <path d="M1 15 Q0.5 16.5 2 17.5 Q3 17 2.5 15Z" fill="#EEEEEE"/>
  <path d="M59 15 Q59.5 16.5 58 17.5 Q57 17 57.5 15Z" fill="#EEEEEE"/>
  <!-- Head — shaped, not a circle -->
  <path d="M27.5 9.5 Q27.5 5.5 30 4.5 Q32.5 5.5 32.5 9.5 Q32.5 12 30 13 Q27.5 12 27.5 9.5Z" fill="#F5F5F5"/>
  <!-- Subtle crown / halo -->
  <path d="M27 7 Q28.5 4 30 3.5 Q31.5 4 33 7" fill="none" stroke="#E0E0E0" stroke-width="0.7" opacity="0.6"/>
