<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 150">
  <!-- Corcovado mountain — distinctive rounded green peak -->
  <path d="M0 150 Q4 132 10 118 Q16 104 22 94 Q26 88 30 85 Q34 88 38 94 Q44 104 50 118 Q56 132 60 150Z" fill="#4CAF50"/>
  <path d="M6 150 Q12 128 18 110 Q23 98 27 91 Q30 87 33 91 Q37 98 42 110 Q48 128 54 150Z" fill="#388E3C"/>
  <!-- Vegetation texture on mountain -->
  <circle cx="14" cy="115" r="2.5" fill="#2E7D32" opacity="0.4"/>
  <circle cx="46" cy="115" r="2.5" fill="#2E7D32" opacity="0.4"/>
  <circle cx="9" cy="125" r="2" fill="#2E7D32" opacity="0.3"/>
  <circle cx="51" cy="125" r="2" fill="#2E7D32" opacity="0.3"/>
  <circle cx="20" cy="105" r="1.5" fill="#2E7D32" opacity="0.35"/>
  <circle cx="40" cy="105" r="1.5" fill="#2E7D32" opacity="0.35"/>

  <!-- Pedestal — tapered with architectural horizontal lines -->
  <path d="M22 87 L24 73 L36 73 L38 87Z" fill="#BDBDBD"/>
  <rect x="23.5" y="71" width="13" height="3" rx="0.5" fill="#CFD8DC"/>
  <line x1="22.5" y1="78" x2="37.5" y2="78" stroke="#9E9E9E" stroke-width="0.4"/>
  <line x1="22.8" y1="81" x2="37.2" y2="81" stroke="#9E9E9E" stroke-width="0.35"/>
  <line x1="23.2" y1="84" x2="36.8" y2="84" stroke="#9E9E9E" stroke-width="0.3"/>
  <line x1="23.8" y1="76" x2="36.2" y2="76" stroke="#9E9E9E" stroke-width="0.3"/>

  <!-- Body / flowing robes — bezier curves for fabric drape -->
  <path d="M26 36 Q24 44 23.5 52 Q23 60 23.5 66 Q24 71 24.5 73 L35.5 73 Q36 71 36.5 66 Q37 60 36.5 52 Q36 44 34 36Z" fill="#F5F5F5"/>
  <!-- Center fold shadow -->
  <path d="M30 38 Q29 47 28.5 57 Q28.5 64 29 72 L31 72 Q31.5 64 31.5 57 Q31 47 30 38Z" fill="#E0E0E0" opacity="0.4"/>
  <!-- Left fold highlight -->
  <path d="M25 46 Q24.5 56 24.5 66 L26 66 Q26 56 26.5 46Z" fill="#EEEEEE" opacity="0.3"/>
  <!-- Right fold highlight -->
  <path d="M35 46 Q35.5 56 35.5 66 L34 66 Q34 56 33.5 46Z" fill="#EEEEEE" opacity="0.3"/>
  <!-- Lower robe flare -->
  <path d="M24.5 68 Q23.5 71 24 73 L36 73 Q36.5 71 35.5 68" fill="#E8E8E8" opacity="0.25"/>

  <!-- Arms outstretched with slight downward drape -->
  <!-- Left arm -->
  <path d="M26 34 Q20 30 14 29 Q8 28.5 3 30 L2 33 Q7 31 13 31 Q20 32 26 37Z" fill="#F5F5F5"/>
  <!-- Left arm underside shadow -->
  <path d="M26 36 Q20 32 14 31 Q8 31 3 32 L2 33 Q7 31.5 13 31.5 Q20 32.5 26 37Z" fill="#E0E0E0" opacity="0.35"/>
  <!-- Right arm -->
  <path d="M34 34 Q40 30 46 29 Q52 28.5 57 30 L58 33 Q53 31 47 31 Q40 32 34 37Z" fill="#F5F5F5"/>
  <!-- Right arm underside shadow -->
  <path d="M34 36 Q40 32 46 31 Q52 31 57 32 L58 33 Q53 31.5 47 31.5 Q40 32.5 34 37Z" fill="#E0E0E0" opacity="0.35"/>

  <!-- Left hand with finger suggestion -->
  <path d="M1 30 Q0 31.5 1 33 L3 33 Q2.5 31.5 2 30Z" fill="#EEEEEE"/>
  <line x1="0.5" y1="30.5" x2="0" y2="29.3" stroke="#E0E0E0" stroke-width="0.4"/>
  <line x1="1.3" y1="30" x2="1" y2="28.8" stroke="#E0E0E0" stroke-width="0.35"/>
  <line x1="2" y1="30" x2="2.2" y2="28.8" stroke="#E0E0E0" stroke-width="0.3"/>
  <!-- Right hand with finger suggestion -->
  <path d="M59 30 Q60 31.5 59 33 L57 33 Q57.5 31.5 58 30Z" fill="#EEEEEE"/>
  <line x1="59.5" y1="30.5" x2="60" y2="29.3" stroke="#E0E0E0" stroke-width="0.4"/>
  <line x1="58.7" y1="30" x2="59" y2="28.8" stroke="#E0E0E0" stroke-width="0.35"/>
  <line x1="58" y1="30" x2="57.8" y2="28.8" stroke="#E0E0E0" stroke-width="0.3"/>

  <!-- Head — properly proportioned oval, not a circle -->
  <path d="M27.5 23 Q27 19 28 16 Q29 14 30 13.5 Q31 14 32 16 Q33 19 32.5 23 Q32 26 30 27 Q28 26 27.5 23Z" fill="#F5F5F5"/>
  <!-- Head shading -->
  <path d="M29 17 Q28.5 20 29 23 L31 23 Q31.5 20 31 17Z" fill="#E8E8E8" opacity="0.3"/>

  <!-- Crown / halo with subtle rays -->
  <path d="M27 17 Q28.5 13 30 12 Q31.5 13 33 17" fill="none" stroke="#E0E0E0" stroke-width="0.8" opacity="0.6"/>
  <line x1="28" y1="14.5" x2="27.5" y2="12" stroke="#E0E0E0" stroke-width="0.3" opacity="0.5"/>
  <line x1="30" y1="13" x2="30" y2="10.5" stroke="#E0E0E0" stroke-width="0.35" opacity="0.5"/>
  <line x1="32" y1="14.5" x2="32.5" y2="12" stroke="#E0E0E0" stroke-width="0.3" opacity="0.5"/>
</svg>
