<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 18">
  <!-- Orca body - smooth arc -->
  <path d="M 3,14 C 5,10 8,4 12,2.5 C 15,1.5 18,2 20,3.5 C 23,5.5 25,9 26,13"
        fill="#1a1a2e" stroke="#111" stroke-width="0.3"/>
  <!-- White belly/chin patch -->
  <path d="M 8,10 C 10,7 14,5.5 17,6.5 C 19,7.5 21,9.5 22,12"
        fill="white" opacity="0.9"/>
  <!-- Grey saddle patch behind dorsal -->
  <path d="M 14,4 C 16,3.5 18,4 19,5.5 C 17,5 15,5 14,4 Z"
        fill="#4a4a5e" opacity="0.6"/>
  <!-- Dorsal fin -->
  <path d="M 13,3.5 C 13.5,0.5 14,0 14.5,0 C 15,0.5 15.5,2.5 16,4"
        fill="#1a1a2e" stroke="#111" stroke-width="0.2"/>
  <!-- Pectoral fin -->
  <path d="M 18,9 C 19,10.5 20,12 19,12.5 C 18,12 17.5,10.5 18,9 Z"
        fill="#1a1a2e" opacity="0.8"/>
  <!-- Tail fluke -->
  <path d="M 2,14.5 C 1,13 0,12 0.5,11.5 C 1.5,12 3,13 4,13.5 Z" fill="#1a1a2e"/>
  <path d="M 2,14.5 C 1,15.5 0.5,16.5 1,17 C 2,16.5 3,15 3.5,14 Z" fill="#1a1a2e"/>
  <!-- Eye patch (white oval behind eye) -->
  <ellipse cx="20.5" cy="4.5" rx="1.8" ry="0.8" fill="white" opacity="0.9" transform="rotate(-15 20.5 4.5)"/>
  <!-- Eye -->
  <circle cx="21" cy="4.5" r="0.4" fill="#1a1a2e"/>
</svg>
