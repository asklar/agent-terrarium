<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 15 20">
  <!-- Hanging string -->
  <line x1="7.5" y1="0" x2="7.5" y2="3" stroke="#FFB300" stroke-width="0.5"/>
  <!-- Top cap -->
  <rect x="5" y="2.5" width="5" height="1.5" rx="0.3" fill="#FFB300"/>
  <!-- Lantern body -->
  <ellipse cx="7.5" cy="10" rx="6" ry="6.5" fill="#D32F2F"/>
  <ellipse cx="7.5" cy="10" rx="4.5" ry="5.5" fill="#E53935" opacity="0.6"/>
  <!-- Horizontal ribs -->
  <line x1="2" y1="8" x2="13" y2="8" stroke="#C62828" stroke-width="0.3" opacity="0.5"/>
  <line x1="1.5" y1="10" x2="13.5" y2="10" stroke="#C62828" stroke-width="0.3" opacity="0.5"/>
  <line x1="2" y1="12" x2="13" y2="12" stroke="#C62828" stroke-width="0.3" opacity="0.5"/>
  <!-- Inner glow -->
  <ellipse cx="7.5" cy="9.5" rx="3" ry="3.5" fill="#FFAB00" opacity="0.3"/>
  <!-- Bottom cap -->
  <rect x="5.5" y="16" width="4" height="1.2" rx="0.3" fill="#FFB300"/>
  <!-- Tassel -->
  <line x1="7.5" y1="17.2" x2="7.5" y2="19.5" stroke="#FFB300" stroke-width="0.8"/>
  <circle cx="7.5" cy="19.5" r="0.6" fill="#FFB300"/>
</svg>
