<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 180">
  <!-- Antenna spire -->
  <rect x="24" y="0" width="2" height="40" fill="#B0BEC5"/>
  <!-- Upper sphere -->
  <circle cx="25" cy="48" r="10" fill="#E91E63"/>
  <circle cx="25" cy="48" r="7" fill="#F06292" opacity="0.6"/>
  <!-- Upper sphere glow -->
  <circle cx="23" cy="46" r="3" fill="#F8BBD0" opacity="0.4"/>
  <!-- Upper column -->
  <rect x="23" y="58" width="4" height="22" fill="#B0BEC5"/>
  <!-- Middle sphere (large) -->
  <circle cx="25" cy="92" r="14" fill="#E91E63"/>
  <circle cx="25" cy="92" r="10" fill="#F06292" opacity="0.6"/>
  <circle cx="22" cy="89" r="4" fill="#F8BBD0" opacity="0.4"/>
  <!-- Lower column -->
  <rect x="23" y="106" width="4" height="18" fill="#B0BEC5"/>
