  <rect x="24" y="62" width="2" height="1" fill="#FFD54F" opacity="0.8"/>
  <rect x="24" y="66" width="2" height="1" fill="#FFD54F" opacity="0.8"/>
  <rect x="24" y="70" width="2" height="1" fill="#FFD54F" opacity="0.8"/>
