<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -24 36 42">
  <!-- Rowlf the Dog -->
  <!-- Body -->
  <ellipse cx="0" cy="6" rx="8" ry="9" fill="#795548"/>
  <!-- Lighter chest -->
  <ellipse cx="0" cy="6" rx="5.5" ry="6.5" fill="#A1887F"/>
  <!-- Arms -->
  <path d="M -8,3 Q -11,1 -12,4" stroke="#795548" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 8,3 Q 11,1 12,4" stroke="#795548" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Head - round, wide, friendly dog face -->
  <ellipse cx="0" cy="-8" rx="11" ry="10" fill="#8D6E63"/>
  <!-- Very long floppy ears - Rowlf's defining feature - hang WAY down past the body -->
  <path d="M -10,-11 Q -12,-8 -16,-2 Q -18,4 -17,10 Q -16,14 -14,16 Q -12,17 -10,14 Q -9,10 -9,5"
        fill="#5D4037" stroke="#4E342E" stroke-width="0.5"/>
  <path d="M -14,2 Q -15,6 -15,10" stroke="#6D4C41" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M 10,-11 Q 12,-8 16,-2 Q 18,4 17,10 Q 16,14 14,16 Q 12,17 10,14 Q 9,10 9,5"
        fill="#5D4037" stroke="#4E342E" stroke-width="0.5"/>
  <path d="M 14,2 Q 15,6 15,10" stroke="#6D4C41" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- Muzzle - prominent, dog-like -->
  <ellipse cx="0" cy="-4" rx="7.5" ry="5.5" fill="#A1887F"/>
  <!-- Lighter muzzle center -->
  <ellipse cx="0" cy="-3" rx="5" ry="3.5" fill="#BCAAA4"/>
  <!-- Eyes - warm, gentle, with heavy droopy lids -->
  <ellipse cx="-4" cy="-11" rx="3.2" ry="3.5" fill="white" stroke="#795548" stroke-width="0.4"/>
  <ellipse cx="4" cy="-11" rx="3.2" ry="3.5" fill="white" stroke="#795548" stroke-width="0.4"/>
  <circle cx="-3.5" cy="-11" r="1.8" fill="#4E342E"/>
  <circle cx="4.5" cy="-11" r="1.8" fill="#4E342E"/>
  <circle cx="-4.5" cy="-12.5" r="0.6" fill="white" opacity="0.8"/>
  <circle cx="3.5" cy="-12.5" r="0.6" fill="white" opacity="0.8"/>
  <!-- Heavy droopy eyelids - sleepy/wise look -->
  <path d="M -7.5,-11.5 Q -4,-14.5 -0.5,-11.5" fill="#795548" stroke="none" opacity="0.7"/>
  <path d="M 0.5,-11.5 Q 4,-14.5 7.5,-11.5" fill="#795548" stroke="none" opacity="0.7"/>
  <!-- Gentle bushy eyebrows -->
  <path d="M -7.5,-14 Q -4,-16 -0.5,-14.5" stroke="#5D4037" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M 0.5,-14.5 Q 4,-16 7.5,-14" stroke="#5D4037" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Big shiny black dog nose -->
  <ellipse cx="0" cy="-5" rx="3.8" ry="2.8" fill="#212121"/>
  <ellipse cx="-1" cy="-6.2" rx="1.5" ry="0.8" fill="#424242" opacity="0.6"/>
  <!-- Nose-to-mouth line -->
  <path d="M 0,-2.2 L 0,-0.5" stroke="#6D4C41" stroke-width="0.7" stroke-linecap="round"/>
  <!-- Warm gentle smile with slight jowls -->
  <path d="M -5.5,-0.5 Q -3,1.5 0,0.5 Q 3,1.5 5.5,-0.5" stroke="#5D4037" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <!-- Jowl lines -->
  <path d="M -6.5,-2 Q -8,1 -7,4" stroke="#795548" stroke-width="0.7" fill="none" opacity="0.4"/>
  <path d="M 6.5,-2 Q 8,1 7,4" stroke="#795548" stroke-width="0.7" fill="none" opacity="0.4"/>
  <!-- Head fur tuft -->
  <path d="M -3,-17 Q -1,-19.5 0,-17 Q 1,-19.5 3,-17" fill="#8D6E63" stroke="none"/>
  <!-- Legs -->
  <path d="M -4,14 L -5,16 L -7,17" stroke="#6D4C41" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 4,14 L 5,16 L 7,17" stroke="#6D4C41" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
