<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 300" width="120" height="300">
  <defs>
    <linearGradient id="velvet-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B0000"/>
      <stop offset="20%" stop-color="#8B0000"/>
      <stop offset="40%" stop-color="#A00000"/>
      <stop offset="70%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#5B0000"/>
    </linearGradient>
    <linearGradient id="gold-trim-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  <!-- Curtain body (mirrored) -->
  <path d="M120,0 L0,0 L0,20 Q20,40 10,80 Q0,120 15,160 Q25,200 12,240 Q5,270 10,300 L120,300 Z"
        fill="url(#velvet-r)" opacity="0.95"/>
  <!-- Folds -->
  <path d="M80,0 Q90,50 75,100 Q65,150 80,200 Q90,250 78,300"
        fill="none" stroke="#5B0000" stroke-width="3" opacity="0.5"/>
  <path d="M50,0 Q60,60 45,120 Q35,180 50,240 Q58,270 52,300"
        fill="none" stroke="#5B0000" stroke-width="2" opacity="0.4"/>
  <!-- Gold trim along left edge -->
  <path d="M5,20 Q20,40 10,80 Q0,120 15,160 Q25,200 12,240 Q5,270 10,300"
        fill="none" stroke="url(#gold-trim-r)" stroke-width="4" opacity="0.8"/>
  <!-- Gold tassel -->
  <circle cx="10" cy="25" r="6" fill="#FFD700" opacity="0.9"/>
  <path d="M10,31 L6,50 M10,31 L10,52 M10,31 L14,50" stroke="#DAA520" stroke-width="1.5" fill="none"/>
  <!-- Valance -->
  <path d="M120,0 L0,0 L0,25 Q20,35 40,25 Q60,15 80,25 Q100,35 120,25 Z"
        fill="url(#velvet-r)" stroke="url(#gold-trim-r)" stroke-width="2"/>
</svg>
