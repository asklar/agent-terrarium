<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 160">
  <!-- Top antenna/spire — thinner and taller -->
  <path d="M 29.7 0 L 30.3 0 L 30.3 14 L 29.7 14 Z" fill="#5D6D7E"/>
  <circle cx="30" cy="0" r="0.8" fill="#FFD54F" opacity="0.8"/>
  <!-- Top platform -->
  <path d="M 27 14 L 33 14 L 32.5 16 L 27.5 16 Z" fill="#6D7F8E"/>
  <rect x="28" y="16" width="4" height="1" fill="#78909C"/>

  <!-- Upper lattice section -->
  <path d="M 28 17 L 32 17 L 35 50 L 25 50 Z" fill="none" stroke="#6D7F8E" stroke-width="1"/>
  <!-- Upper horizontal cross-braces -->
  <line x1="28.3" y1="22" x2="31.7" y2="22" stroke="#6D7F8E" stroke-width="0.5"/>
  <line x1="28" y1="27" x2="32" y2="27" stroke="#6D7F8E" stroke-width="0.5"/>
  <line x1="27.5" y1="32" x2="32.5" y2="32" stroke="#6D7F8E" stroke-width="0.5"/>
  <line x1="27" y1="37" x2="33" y2="37" stroke="#6D7F8E" stroke-width="0.5"/>
  <line x1="26.5" y1="42" x2="33.5" y2="42" stroke="#6D7F8E" stroke-width="0.5"/>
  <line x1="26" y1="47" x2="34" y2="47" stroke="#6D7F8E" stroke-width="0.5"/>
  <!-- Upper diagonal X-pattern cross-braces -->
  <line x1="28.3" y1="22" x2="32" y2="27" stroke="#78909C" stroke-width="0.35"/>
  <line x1="31.7" y1="22" x2="28" y2="27" stroke="#78909C" stroke-width="0.35"/>
  <line x1="27.5" y1="32" x2="33" y2="37" stroke="#78909C" stroke-width="0.35"/>
  <line x1="32.5" y1="32" x2="27" y2="37" stroke="#78909C" stroke-width="0.35"/>
  <line x1="26.5" y1="42" x2="34" y2="47" stroke="#78909C" stroke-width="0.35"/>
  <line x1="33.5" y1="42" x2="26" y2="47" stroke="#78909C" stroke-width="0.35"/>

  <!-- Middle observation deck -->
  <path d="M 22 50 L 38 50 L 37.5 52 L 22.5 52 Z" fill="#6D7F8E"/>
  <rect x="23" y="52" width="14" height="2" fill="#78909C"/>
  <rect x="21" y="54" width="18" height="1.5" fill="#5D6D7E"/>
  <!-- Railing details on middle deck -->
  <line x1="23" y1="50" x2="23" y2="52" stroke="#78909C" stroke-width="0.4"/>
  <line x1="26.5" y1="50" x2="26.5" y2="52" stroke="#78909C" stroke-width="0.4"/>
  <line x1="30" y1="50" x2="30" y2="52" stroke="#78909C" stroke-width="0.4"/>
  <line x1="33.5" y1="50" x2="33.5" y2="52" stroke="#78909C" stroke-width="0.4"/>
  <line x1="37" y1="50" x2="37" y2="52" stroke="#78909C" stroke-width="0.4"/>

  <!-- Middle lattice section -->
  <path d="M 23 55.5 L 37 55.5 L 45 105 L 15 105 Z" fill="none" stroke="#5D6D7E" stroke-width="1.2"/>
  <!-- Middle horizontal cross-braces -->
  <line x1="24" y1="62" x2="36" y2="62" stroke="#6D7F8E" stroke-width="0.6"/>
  <line x1="23" y1="69" x2="37" y2="69" stroke="#6D7F8E" stroke-width="0.6"/>
  <line x1="22" y1="76" x2="38" y2="76" stroke="#6D7F8E" stroke-width="0.6"/>
  <line x1="20.5" y1="83" x2="39.5" y2="83" stroke="#6D7F8E" stroke-width="0.6"/>
  <line x1="19" y1="90" x2="41" y2="90" stroke="#6D7F8E" stroke-width="0.6"/>
  <line x1="17.5" y1="97" x2="42.5" y2="97" stroke="#6D7F8E" stroke-width="0.6"/>
  <!-- Middle diagonal X-pattern cross-braces -->
  <line x1="24" y1="62" x2="37" y2="69" stroke="#78909C" stroke-width="0.35"/>
  <line x1="36" y1="62" x2="23" y2="69" stroke="#78909C" stroke-width="0.35"/>
  <line x1="22" y1="76" x2="39.5" y2="83" stroke="#78909C" stroke-width="0.35"/>
  <line x1="38" y1="76" x2="20.5" y2="83" stroke="#78909C" stroke-width="0.35"/>
  <line x1="19" y1="90" x2="42.5" y2="97" stroke="#78909C" stroke-width="0.35"/>
  <line x1="41" y1="90" x2="17.5" y2="97" stroke="#78909C" stroke-width="0.35"/>

  <!-- Prominent arch between legs -->
  <path d="M 18 103 Q 30 86 42 103" fill="none" stroke="#5D6D7E" stroke-width="2"/>
  <path d="M 20 103 Q 30 89 40 103" fill="none" stroke="#6D7F8E" stroke-width="1"/>

  <!-- Lower platform -->
  <path d="M 12 105 L 48 105 L 47 108 L 13 108 Z" fill="#5D6D7E"/>
  <rect x="13" y="108" width="34" height="1.5" fill="#6D7F8E"/>

  <!-- Left leg with four lines -->
  <path d="M 14 109.5 Q 11 130 5 150 Q 3 155 0 158" stroke="#5D6D7E" stroke-width="1.4" fill="none"/>
  <path d="M 20 109.5 Q 17 130 12 150 Q 10 155 8 158" stroke="#5D6D7E" stroke-width="1.4" fill="none"/>
  <!-- Left leg arch at base -->
  <path d="M 0 158 Q 4 149 8 158" fill="none" stroke="#6D7F8E" stroke-width="1.2"/>
  <!-- Left leg cross-braces -->
  <line x1="12" y1="118" x2="19" y2="118" stroke="#6D7F8E" stroke-width="0.6"/>
  <line x1="10" y1="128" x2="17" y2="128" stroke="#6D7F8E" stroke-width="0.6"/>
  <line x1="8" y1="138" x2="15" y2="138" stroke="#6D7F8E" stroke-width="0.6"/>
  <line x1="5.5" y1="148" x2="12.5" y2="148" stroke="#6D7F8E" stroke-width="0.6"/>
  <!-- Left leg diagonal X struts -->
  <line x1="12" y1="118" x2="17" y2="128" stroke="#78909C" stroke-width="0.35"/>
  <line x1="19" y1="118" x2="10" y2="128" stroke="#78909C" stroke-width="0.35"/>
  <line x1="8" y1="138" x2="12.5" y2="148" stroke="#78909C" stroke-width="0.35"/>
  <line x1="15" y1="138" x2="5.5" y2="148" stroke="#78909C" stroke-width="0.35"/>

  <!-- Right leg with four lines -->
  <path d="M 40 109.5 Q 43 130 48 150 Q 50 155 52 158" stroke="#5D6D7E" stroke-width="1.4" fill="none"/>
  <path d="M 46 109.5 Q 49 130 55 150 Q 57 155 60 158" stroke="#5D6D7E" stroke-width="1.4" fill="none"/>
  <!-- Right leg arch at base -->
  <path d="M 52 158 Q 56 149 60 158" fill="none" stroke="#6D7F8E" stroke-width="1.2"/>
  <!-- Right leg cross-braces -->
  <line x1="41" y1="118" x2="48" y2="118" stroke="#6D7F8E" stroke-width="0.6"/>
  <line x1="43" y1="128" x2="50" y2="128" stroke="#6D7F8E" stroke-width="0.6"/>
  <line x1="45" y1="138" x2="52" y2="138" stroke="#6D7F8E" stroke-width="0.6"/>
  <line x1="47.5" y1="148" x2="54.5" y2="148" stroke="#6D7F8E" stroke-width="0.6"/>
  <!-- Right leg diagonal X struts -->
  <line x1="41" y1="118" x2="50" y2="128" stroke="#78909C" stroke-width="0.35"/>
  <line x1="48" y1="118" x2="43" y2="128" stroke="#78909C" stroke-width="0.35"/>
  <line x1="45" y1="138" x2="54.5" y2="148" stroke="#78909C" stroke-width="0.35"/>
  <line x1="52" y1="138" x2="47.5" y2="148" stroke="#78909C" stroke-width="0.35"/>

  <!-- Base -->
  <path d="M -2 158 L 62 158 L 62 160 L -2 160 Z" fill="#455A64"/>

  <!-- Evening illumination lights -->
  <circle cx="30" cy="16" r="0.6" fill="#FFD54F" opacity="0.7"/>
  <circle cx="28.5" cy="34" r="0.5" fill="#FFD54F" opacity="0.5"/>
  <circle cx="31.5" cy="34" r="0.5" fill="#FFD54F" opacity="0.5"/>
  <circle cx="30" cy="52" r="0.6" fill="#FFD54F" opacity="0.6"/>
  <circle cx="25" cy="76" r="0.5" fill="#FFD54F" opacity="0.4"/>
  <circle cx="35" cy="76" r="0.5" fill="#FFD54F" opacity="0.4"/>
  <circle cx="30" cy="90" r="0.5" fill="#FFD54F" opacity="0.4"/>
  <circle cx="20" cy="97" r="0.5" fill="#FFD54F" opacity="0.35"/>
  <circle cx="40" cy="97" r="0.5" fill="#FFD54F" opacity="0.35"/>
  <circle cx="10" cy="135" r="0.5" fill="#FFD54F" opacity="0.3"/>
  <circle cx="50" cy="135" r="0.5" fill="#FFD54F" opacity="0.3"/>
</svg>
