<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 70">
  <!-- Left pillar -->
  <rect x="2" y="14" width="22" height="56" fill="#A1887F"/>
  <!-- Right pillar -->
  <rect x="56" y="14" width="22" height="56" fill="#A1887F"/>

  <!-- Left pillar sculptural relief — vertical fluting -->
  <line x1="7" y1="18" x2="7" y2="66" stroke="#8D6E63" stroke-width="0.5" opacity="0.5"/>
  <line x1="11" y1="18" x2="11" y2="66" stroke="#8D6E63" stroke-width="0.5" opacity="0.5"/>
  <line x1="15" y1="18" x2="15" y2="66" stroke="#8D6E63" stroke-width="0.5" opacity="0.5"/>
  <line x1="19" y1="18" x2="19" y2="66" stroke="#8D6E63" stroke-width="0.5" opacity="0.5"/>
  <!-- Left pillar horizontal bands -->
  <rect x="4" y="28" width="18" height="1" fill="#BCAAA4" opacity="0.4"/>
  <rect x="4" y="42" width="18" height="1" fill="#BCAAA4" opacity="0.4"/>
  <rect x="4" y="56" width="18" height="1" fill="#BCAAA4" opacity="0.4"/>
  <!-- Left pillar sculptural relief panels -->
  <rect x="5" y="30" width="8" height="10" rx="0.5" fill="#8D6E63" opacity="0.2"/>
  <rect x="5" y="44" width="8" height="10" rx="0.5" fill="#8D6E63" opacity="0.2"/>

  <!-- Right pillar sculptural relief — vertical fluting -->
  <line x1="61" y1="18" x2="61" y2="66" stroke="#8D6E63" stroke-width="0.5" opacity="0.5"/>
  <line x1="65" y1="18" x2="65" y2="66" stroke="#8D6E63" stroke-width="0.5" opacity="0.5"/>
  <line x1="69" y1="18" x2="69" y2="66" stroke="#8D6E63" stroke-width="0.5" opacity="0.5"/>
  <line x1="73" y1="18" x2="73" y2="66" stroke="#8D6E63" stroke-width="0.5" opacity="0.5"/>
  <!-- Right pillar horizontal bands -->
  <rect x="58" y="28" width="18" height="1" fill="#BCAAA4" opacity="0.4"/>
  <rect x="58" y="42" width="18" height="1" fill="#BCAAA4" opacity="0.4"/>
  <rect x="58" y="56" width="18" height="1" fill="#BCAAA4" opacity="0.4"/>
  <!-- Right pillar sculptural relief panels -->
  <rect x="67" y="30" width="8" height="10" rx="0.5" fill="#8D6E63" opacity="0.2"/>
  <rect x="67" y="44" width="8" height="10" rx="0.5" fill="#8D6E63" opacity="0.2"/>

  <!-- Attic story / top entablature -->
  <rect x="0" y="0" width="80" height="14" rx="1" fill="#8D6E63"/>
  <!-- Frieze pattern on attic -->
  <rect x="2" y="3" width="76" height="1" fill="#BCAAA4" opacity="0.5"/>
  <rect x="2" y="6" width="76" height="1" fill="#BCAAA4" opacity="0.4"/>
  <!-- Decorative frieze band -->
  <rect x="2" y="10" width="76" height="4" fill="#BCAAA4"/>
  <!-- Frieze relief tick marks -->
  <line x1="6" y1="10.5" x2="6" y2="13.5" stroke="#8D6E63" stroke-width="0.5" opacity="0.5"/>
  <line x1="12" y1="10.5" x2="12" y2="13.5" stroke="#8D6E63" stroke-width="0.5" opacity="0.5"/>
  <line x1="18" y1="10.5" x2="18" y2="13.5" stroke="#8D6E63" stroke-width="0.5" opacity="0.5"/>
  <line x1="30" y1="10.5" x2="30" y2="13.5" stroke="#8D6E63" stroke-width="0.5" opacity="0.5"/>
  <line x1="40" y1="10.5" x2="40" y2="13.5" stroke="#8D6E63" stroke-width="0.5" opacity="0.5"/>
  <line x1="50" y1="10.5" x2="50" y2="13.5" stroke="#8D6E63" stroke-width="0.5" opacity="0.5"/>
  <line x1="62" y1="10.5" x2="62" y2="13.5" stroke="#8D6E63" stroke-width="0.5" opacity="0.5"/>
  <line x1="68" y1="10.5" x2="68" y2="13.5" stroke="#8D6E63" stroke-width="0.5" opacity="0.5"/>
  <line x1="74" y1="10.5" x2="74" y2="13.5" stroke="#8D6E63" stroke-width="0.5" opacity="0.5"/>

  <!-- Central arch -->
  <path d="M 24 70 L 24 38 Q 24 20 40 20 Q 56 20 56 38 L 56 70 Z" fill="#5D4037"/>
  <!-- Inner arch highlight -->
  <path d="M 27 70 L 27 40 Q 27 24 40 24 Q 53 24 53 40 L 53 70 Z" fill="#4E342E"/>
  <!-- Keystone accent at arch top -->
  <rect x="38" y="20" width="4" height="3" fill="#A1887F" opacity="0.5"/>

  <!-- Pillar edge details -->
  <rect x="2" y="14" width="3" height="56" fill="#8D6E63" opacity="0.5"/>
  <rect x="75" y="14" width="3" height="56" fill="#8D6E63" opacity="0.5"/>

  <!-- Top cornice -->
  <rect x="-1" y="-1" width="82" height="3" rx="0.5" fill="#795548"/>

  <!-- Tricolor flag on top — blue/white/red -->
  <rect x="39" y="-10" width="1" height="9" fill="#6D4C41"/>
  <rect x="40" y="-10" width="2.3" height="5" fill="#1565C0"/>
  <rect x="42.3" y="-10" width="2.4" height="5" fill="#FFFFFF"/>
  <rect x="44.7" y="-10" width="2.3" height="5" fill="#E53935"/>
</svg>
